name: Refresh data and SEO

on:
  workflow_dispatch:
  schedule:
    - cron: "17 8 * * 1"

permissions:
  contents: write

concurrency:
  group: refresh-data-and-seo
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Refresh Capitol Trades data and SEO pages
        run: python3 scripts/refresh_data_and_seo.py

      - name: Validate generated static site
        run: python3 scripts/validate_static_site.py

      - name: Commit generated outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            capitoltrades_data.js \
            index.html \
            robots.txt \
            sitemap.xml \
            rss.xml \
            og-image.svg \
            methodology/index.html \
            data/index.html \
            datasets/committee-risk/index.html \
            updates/latest/index.html \
            scenes/*/index.html
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
          else
            git commit -m "Refresh Capitol Trades data and SEO pages"
            git push
          fi
