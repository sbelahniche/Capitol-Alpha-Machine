name: Verify weekly data and SEO publication

on:
  workflow_dispatch:
  schedule:
    - cron: "17 8 * * 1"

permissions:
  contents: read

concurrency:
  group: verify-weekly-data-and-seo
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Wait for this Monday's publication
        run: >-
          python3 scripts/check_weekly_publication.py
          --attempts 10
          --interval 300
